# Netlify détecte Next.js et applique automatiquement son adaptateur OpenNext.
# Ne pas ajouter [[plugins]] @netlify/plugin-nextjs : c'est l'ancienne méthode, elle bloque les mises à jour.
[build]
  command = "npm run build"

[build.environment]
  # Les variables NEXT_PUBLIC_* sont publiques par conception : Next.js les inclut dans le JS envoyé
  # au navigateur, et le scanner de secrets Netlify les prendrait pour une fuite.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,CLAUDE_MODEL"
  # Fichiers qui contiennent des exemples de clés, jamais de vraies valeurs
  SECRETS_SCAN_OMIT_PATHS = ".env.example,README.md,docs/**"
